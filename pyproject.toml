[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-reflection-synthesis-engine"
version = "0.1.0"
description = "Post-execution self-critique, failure mode attribution, and persistent cognitive heuristic generator for autonomous agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
cognitive-reflection-synthesis-engine = "cognitive_reflection_synthesis_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cognitive_reflection_synthesis_engine*"]
